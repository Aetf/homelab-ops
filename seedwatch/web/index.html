<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>seedwatch</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font: 14px/1.5 system-ui, sans-serif; margin: 1.5rem auto; max-width: 72rem;
    padding: 0 1rem;
    background: light-dark(#fafafa, #14161a); color: light-dark(#1c1e21, #d8dade);
  }
  h1 { font-size: 1.3rem; } h2 { font-size: 1.05rem; margin: 1.6rem 0 .4rem; }
  .muted { color: light-dark(#68707a, #8b949e); }
  .banner { padding: .5rem .8rem; border-radius: 6px; margin: .6rem 0; }
  .dry { background: light-dark(#fff3cd, #3a3320); }
  .err { background: light-dark(#f8d7da, #40272a); }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: .28rem .5rem; border-bottom: 1px solid light-dark(#e3e5e8, #2a2e34); }
  th { font-weight: 600; color: light-dark(#454b52, #a8b0b8); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .name { max-width: 32rem; overflow-wrap: anywhere; }
  .tag { display: inline-block; padding: 0 .4rem; border-radius: 4px; font-size: .8rem;
         background: light-dark(#e7ebf0, #2c313a); margin-right: .25rem; }
  .tag.ToDelete { background: light-dark(#fde2e1, #46262b); }
  .tag.Keep { background: light-dark(#dcefdc, #24382a); }
  .tag.Trimmed { background: light-dark(#dceef0, #1f3538); }
  button { font: inherit; font-size: .8rem; padding: .1rem .5rem; border-radius: 4px;
           border: 1px solid light-dark(#c8cdd3, #3d434b);
           background: light-dark(#fff, #1e2228); color: inherit; cursor: pointer; }
  button:hover { background: light-dark(#f0f2f4, #2a2f37); }
  .summary span { margin-right: 1.2rem; }
  details > summary { cursor: pointer; margin: 1.6rem 0 .4rem; font-weight: 600; }
  input[type=search] { font: inherit; padding: .1rem .5rem; border-radius: 4px;
    border: 1px solid light-dark(#c8cdd3, #3d434b);
    background: light-dark(#fff, #1e2228); color: inherit; min-width: 16rem; }
  th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
  th.sortable:hover { color: light-dark(#1c1e21, #d8dade); }
  /* categorical series (validated palette, light/dark stepped) */
  :root { --s1: light-dark(#2a78d6, #3987e5); --s2: light-dark(#eb6834, #d95926);
          --s3: light-dark(#1baf7a, #199e70); --s4: light-dark(#eda100, #c98500);
          --s5: light-dark(#e87ba4, #d55181); --sother: #898781;
          --surface: light-dark(#fafafa, #14161a);
          --grid: light-dark(#e3e5e8, #2a2e34); --muted: #898781; }
  .chartrow { display: flex; gap: 2rem; flex-wrap: wrap; align-items: flex-start; }
  .chartrow table { width: auto; }
  .legend { margin: .4rem 0; }
  .legend span.lg { margin-right: 1.1rem; white-space: nowrap; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px;
        margin-right: .35rem; vertical-align: baseline; }
  .toggle button[aria-pressed="true"] { background: light-dark(#e7ebf0, #2c313a); font-weight: 600; }
  #tip { position: fixed; pointer-events: none; z-index: 10; font-size: .8rem;
         background: light-dark(#fff, #1e2228); border: 1px solid light-dark(#c8cdd3, #3d434b);
         border-radius: 6px; padding: .35rem .6rem; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  svg text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<h1>seedwatch <span id="scanning" class="muted"></span></h1>
<div id="banners"></div>
<p class="summary" id="summary"></p>
<p><button onclick="rescan()">重新扫描</button>
   <input id="filter" type="search" placeholder="过滤名称 / 分类…" oninput="ui.filter=this.value.toLowerCase();render()">
   <span class="muted" id="generated"></span></p>
<div id="charts"></div>
<div id="sections"></div>
<div id="tip" hidden></div>
<script>
const fmtSize = n => { for (const u of ['B','K','M','G','T']) { if (Math.abs(n) < 1024) return n.toFixed(1)+u; n /= 1024; } return n.toFixed(1)+'P'; };
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// filter is a substring match on 名称/分类; sort[tableKey] = {col, desc};
// metric: 0 = bytes, 1 = torrent count (charts only)
const ui = { filter: '', sort: {}, metric: 0 };

async function api(method, path) {
  const r = await fetch(path, {method});
  if (!r.ok) alert(`${method} ${path}: ${r.status}`);
  load();  // tag changes are reflected in the server report immediately
}
const rescan = () => api('POST', '/api/rescan');
const tag = (h, t) => api('POST', `/api/torrents/${h}/tags/${t}`);
const untag = (h, t) => api('DELETE', `/api/torrents/${h}/tags/${t}`);

function sortBy(key, col) {
  const s = ui.sort[key];
  ui.sort[key] = { col, desc: s && s.col === col ? !s.desc : true };
  render();
}

function tagChips(t) {
  return t.tags.map(x => `<span class="tag ${esc(x)}">${esc(x)}${
    (x === 'ToDelete' || x === 'Keep' || x === 'Trimmed')
      ? ` <a href="#" onclick="untag('${t.hash}','${x}');return false">×</a>` : ''
  }</span>`).join('');
}
function actionBtns(t) {
  let b = '';
  if (!t.tags.includes('ToDelete')) b += `<button onclick="tag('${t.hash}','ToDelete')">ToDelete</button> `;
  if (!t.tags.includes('Keep')) b += `<button onclick="tag('${t.hash}','Keep')">Keep</button> `;
  if (t.status === 'partial' && !t.tags.includes('Trimmed'))
    b += `<button onclick="tag('${t.hash}','Trimmed')">Trimmed</button>`;
  return b;
}
// extraCols entries: [label, renderFn, sortAccessor?]
function torrentTable(key, rows, extraCols = []) {
  rows = rows.filter(t => !ui.filter
    || t.name.toLowerCase().includes(ui.filter) || t.category.toLowerCase().includes(ui.filter));
  if (!rows.length) return '<p class="muted">（无）</p>';
  const cols = [
    ['分类', t => `<td>${esc(t.category)}</td>`, t => t.category],
    ['名称', t => `<td class="name">${esc(t.name)}</td>`, t => t.name],
    ['大小', t => `<td class="num">${fmtSize(t.size)}</td>`, t => t.size],
    ['ratio / 目标', t => `<td class="num">${t.ratio.toFixed(2)} / ${t.ratio_target}</td>`, t => t.ratio],
    ...extraCols.map(c => [c[0], t => `<td>${c[1](t)}</td>`, c[2]]),
    ['标签', t => `<td>${tagChips(t)}</td>`],
    ['操作', t => `<td>${actionBtns(t)}</td>`],
  ];
  const s = ui.sort[key];
  if (s) {
    const acc = (cols.find(c => c[0] === s.col) || [])[2];
    if (acc) rows = [...rows].sort((a, b) => {
      const x = acc(a), y = acc(b);
      return (typeof x === 'string' ? x.localeCompare(y) : x - y) * (s.desc ? -1 : 1);
    });
  }
  const head = cols.map(c => c[2]
    ? `<th class="sortable" onclick="sortBy('${key}','${c[0]}')">${c[0]}${
        s && s.col === c[0] ? (s.desc ? ' ▼' : ' ▲') : ''}</th>`
    : `<th>${c[0]}</th>`).join('');
  return `<table><tr>${head}</tr>` +
    rows.map(t => `<tr>${cols.map(c => c[1](t)).join('')}</tr>`).join('') + '</table>';
}
function section(title, html, open = true) {
  return open ? `<h2>${title}</h2>${html}`
              : `<details><summary>${title}</summary>${html}</details>`;
}

let lastData = null;
let lastHistory = [];

async function load() {
  [lastData, lastHistory] = await Promise.all([
    (await fetch('/api/report')).json(), (await fetch('/api/history')).json()]);
  render();
}

// ---- category charts (pie = current share, stacked area = trend) ----
// Fixed slot order so colors follow the category across time and filters;
// everything else folds into 其他 (gray). Edit here if the library's big
// categories ever change.
const CAT_ORDER = ['Mov', '电影', '剧集', '动漫', 'Anim'];
const NC = CAT_ORDER.length;
const SER = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--sother)'];
const catName = i => i < NC ? CAT_ORDER[i] : '其他';
const slotOf = c => { const i = CAT_ORDER.indexOf(c); return i < 0 ? NC : i; };
const mval = o => ui.metric ? o[1] : o[0];          // o = [size, count]
const mfmt = v => ui.metric ? String(v) : fmtSize(v);
let pieData = null, trendMeta = null;

const tipEl = () => document.getElementById('tip');
function showTip(ev, html) {
  const el = tipEl();
  el.innerHTML = html; el.hidden = false;
  const x = Math.min(ev.clientX + 14, innerWidth - el.offsetWidth - 8);
  el.style.left = x + 'px'; el.style.top = (ev.clientY + 14) + 'px';
}
function hideTip() { tipEl().hidden = true; }

function pieTip(ev, i) {
  const v = pieData.slots[i], total = pieData.total;
  showTip(ev, `<span class="sw" style="background:${SER[i]}"></span>${catName(i)}：${
    mfmt(mval(v))} (${(100 * mval(v) / total).toFixed(1)}%)`);
}

function arcPath(cx, cy, r, a0, a1) {
  a1 = Math.min(a1, a0 + Math.PI * 2 - 1e-3);
  const px = a => (cx + r * Math.sin(a)).toFixed(1), py = a => (cy - r * Math.cos(a)).toFixed(1);
  return `M${cx},${cy} L${px(a0)},${py(a0)} A${r},${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${px(a1)},${py(a1)} Z`;
}

function chartsHtml(rep) {
  // aggregate the snapshot: fixed slots for the charts + full per-category
  // rows for the table view
  const slots = Array.from({length: NC + 1}, () => [0, 0]);
  const full = {};
  for (const t of rep.torrents) {
    const s = slots[slotOf(t.category)], f = (full[t.category || '未分类'] ??= [0, 0]);
    s[0] += t.size; s[1]++; f[0] += t.size; f[1]++;
  }
  const total = slots.reduce((a, s) => a + mval(s), 0) || 1;
  pieData = { slots, total };

  let a = 0;
  const slices = slots.map((s, i) => {
    const v = mval(s); if (!v) return '';
    const a0 = a; a += v / total * Math.PI * 2;
    return `<path d="${arcPath(100, 100, 88, a0, a)}" fill="${SER[i]}"
      stroke="var(--surface)" stroke-width="2"
      onmousemove="pieTip(event,${i})" onmouseleave="hideTip()"/>`;
  }).join('');
  const pie = `<svg width="200" height="200" role="img" aria-label="分类占比饼图">${slices}</svg>`;

  const catTable = '<table><tr><th>分类</th><th class="num">大小</th><th class="num">数量</th><th class="num">占比</th></tr>' +
    Object.entries(full).sort((x, y) => mval(y[1]) - mval(x[1])).map(([c, v]) => `
      <tr><td><span class="sw" style="background:${SER[slotOf(c === '未分类' ? '' : c)]}"></span>${esc(c)}</td>
      <td class="num">${fmtSize(v[0])}</td><td class="num">${v[1]}</td>
      <td class="num">${(100 * mval(v) / total).toFixed(1)}%</td></tr>`).join('') + '</table>';

  const legend = '<p class="legend">' + slots.map((s, i) => mval(s)
    ? `<span class="lg"><span class="sw" style="background:${SER[i]}"></span>${catName(i)} ${mfmt(mval(s))}</span>`
    : '').join('') + '</p>';

  const toggle = `<span class="toggle">
    <button aria-pressed="${!ui.metric}" onclick="ui.metric=0;render()">空间</button>
    <button aria-pressed="${!!ui.metric}" onclick="ui.metric=1;render()">数量</button></span>`;

  return `<h2>分类占比 ${toggle}</h2>${legend}
    <div class="chartrow"><div>${pie}</div><div>${catTable}</div></div>
    <h2>趋势</h2>${trendHtml()}`;
}

function trendHtml() {
  if (lastHistory.length < 2)
    return '<p class="muted">趋势图需要至少两轮扫描的历史（每小时一轮，正在积累）。</p>';
  const vals = lastHistory.map(e => {
    const v = Array(NC + 1).fill(0);
    for (const [c, sc] of Object.entries(e.cats)) v[slotOf(c)] += mval(sc);
    return v;
  });
  const W = 760, PT = 8, PH = 190, AX = 22, PL = 56, PR = 8;
  const t0 = lastHistory[0].ts, t1 = lastHistory[lastHistory.length - 1].ts;
  const X = ts => PL + (ts - t0) / (t1 - t0 || 1) * (W - PL - PR);
  const ymax = Math.max(...vals.map(v => v.reduce((a, b) => a + b, 0))) * 1.05 || 1;
  const Y = v => PT + (1 - v / ymax) * (PH - PT);
  trendMeta = { X, vals, PL, PR, W };

  // cumulative stacks, slot 0 at the bottom
  const cum = vals.map(v => { let c = 0; return v.map(x => c += x); });
  const line = (k, rev) => {
    const pts = lastHistory.map((e, j) => `${X(e.ts).toFixed(1)},${Y(cum[j][k]).toFixed(1)}`);
    return (rev ? pts.reverse() : pts).join(' ');
  };
  const areas = [];
  for (let k = NC; k >= 0; k--) {
    const bottom = k === 0
      ? `${X(t1).toFixed(1)},${Y(0)} ${X(t0).toFixed(1)},${Y(0)}` : line(k - 1, true);
    areas.push(`<polygon points="${line(k, false)} ${bottom}" fill="${SER[k]}"
      stroke="var(--surface)" stroke-width="2"/>`);
  }
  const grid = [0.5, 1].map(f => `
    <line x1="${PL}" y1="${Y(ymax * f)}" x2="${W - PR}" y2="${Y(ymax * f)}" stroke="var(--grid)"/>
    <text x="${PL - 6}" y="${Y(ymax * f) + 4}" text-anchor="end">${mfmt(Math.round(ymax * f))}</text>`);
  const xticks = [0, 0.5, 1].map(f => {
    const ts = t0 + (t1 - t0) * f;
    const anchor = f === 0 ? 'start' : f === 1 ? 'end' : 'middle';
    return `<text x="${X(ts)}" y="${PH + AX - 6}" text-anchor="${anchor}">${
      new Date(ts * 1000).toLocaleDateString('zh', {month: 'numeric', day: 'numeric'})}</text>`;
  });
  return `<svg id="trend" width="${W}" height="${PH + AX}" role="img" aria-label="分类趋势图"
      style="max-width:100%" onmousemove="trendTip(event)" onmouseleave="hideTip();trendXh(-1)">
    ${grid.join('')}${areas.join('')}
    <line id="xh" y1="${PT}" y2="${PH}" stroke="var(--muted)" visibility="hidden"/>
    <line x1="${PL}" y1="${Y(0)}" x2="${W - PR}" y2="${Y(0)}" stroke="var(--grid)"/>
    ${xticks.join('')}</svg>`;
}

function trendXh(x) {
  const xh = document.getElementById('xh');
  if (xh) { xh.setAttribute('visibility', x < 0 ? 'hidden' : 'visible'); if (x >= 0) { xh.setAttribute('x1', x); xh.setAttribute('x2', x); } }
}
function trendTip(ev) {
  const svg = document.getElementById('trend');
  const px = (ev.clientX - svg.getBoundingClientRect().left) * (svg.width.baseVal.value / svg.getBoundingClientRect().width);
  let best = 0, bd = Infinity;
  lastHistory.forEach((e, j) => {
    const d = Math.abs(trendMeta.X(e.ts) - px); if (d < bd) { bd = d; best = j; }
  });
  trendXh(trendMeta.X(lastHistory[best].ts));
  const v = trendMeta.vals[best];
  showTip(ev, `<b>${new Date(lastHistory[best].ts * 1000).toLocaleString()}</b><br>` +
    v.map((x, i) => x ? `<span class="sw" style="background:${SER[i]}"></span>${catName(i)} ${mfmt(x)}` : '')
      .filter(Boolean).join('<br>') + `<br>合计 ${mfmt(v.reduce((a, b) => a + b, 0))}`);
}

function render() {
  const data = lastData;
  if (!data) return;
  document.getElementById('scanning').textContent = data.scanning ? '（扫描中…）' : '';
  const banners = [];
  if (data.dry_run) banners.push('<div class="banner dry">dry-run 模式：只报告、打标和删除都不会真正执行。确认无误后在配置里关闭。</div>');
  if (data.error) banners.push(`<div class="banner err">上次扫描失败：${esc(data.error.detail)}</div>`);
  document.getElementById('banners').innerHTML = banners.join('');
  const rep = data.report;
  if (!rep) { document.getElementById('summary').textContent = '首次扫描尚未完成…'; return; }
  document.getElementById('generated').textContent =
    '上次扫描: ' + new Date(rep.generated_at * 1000).toLocaleString();
  document.getElementById('charts').innerHTML = chartsHtml(rep);

  const by = s => rep.torrents.filter(t => t.status === s);
  const partial = by('partial');
  const unref = by('unreferenced');
  const anomaly = [...by('missing'), ...by('no_media')];
  const waiting = rep.torrents.filter(t => t.tags.includes('ToDelete') && !t.tags.includes('Keep'));
  const counts = {};
  for (const t of rep.torrents) counts[t.status] = (counts[t.status] || 0) + 1;
  document.getElementById('summary').innerHTML =
    `<span>共 ${rep.torrents.length} 个 torrent</span>` +
    Object.entries(counts).map(([k, v]) => `<span>${k}: ${v}</span>`).join('');

  const secs = [];
  secs.push(section(`① 部分引用 — 需人工裁决 (${partial.length})`,
    torrentTable('partial', partial, [['引用', t => `${t.media_total - t.media_unref}/${t.media_total} 保留，可释放 ${fmtSize(t.unref_bytes)}`, t => t.unref_bytes]])));
  secs.push(section(`② Media 已全删（自动打标范围）(${unref.length})`,
    torrentTable('unref', unref)));
  secs.push(section(`③ 待收割队列 — ToDelete 等 ratio 达标 (${waiting.length})`,
    torrentTable('waiting', waiting, [['做种天数', t => t.seeding_days, t => t.seeding_days], ['tracker', t => esc(t.tracker), t => t.tracker]])));
  secs.push(section(`④ 本轮动作 (${rep.actions_taken.length})`,
    rep.actions_taken.length ? '<table><tr><th>动作</th><th>名称</th><th>ratio</th><th>详情</th></tr>' +
      rep.actions_taken.map(a => `<tr><td>${a.action}${a.dry_run ? ' (dry-run)' : ''}</td>
        <td class="name">${esc(a.name)}</td><td class="num">${a.ratio}</td>
        <td>${a.action === 'reap' ? (a.delete_files ? '删文件' : '仅删条目，文件由 ' + esc((a.shared_with || []).join(', ')) + ' 保留') : ''}</td></tr>`).join('')
      + '</table>' : '<p class="muted">（无）</p>'));
  secs.push(section(`⑤ 异常 — 文件缺失 / 无媒体文件 (${anomaly.length})`,
    torrentTable('anomaly', anomaly, [['状态', t => t.status, t => t.status]]), anomaly.length > 0));
  secs.push(section(`⑥ cross-seed 组 (${rep.cross_seed.length})`,
    rep.cross_seed.length ? '<ul>' + rep.cross_seed.map(g => `<li>${g.map(esc).join(' ⇄ ')}</li>`).join('') + '</ul>'
      : '<p class="muted">（无）</p>', false));
  const orphans = rep.orphans
    .filter(o => !ui.filter || o.path.toLowerCase().includes(ui.filter))
    .sort((a, b) => b.size - a.size);
  secs.push(section(`⑦ 孤儿文件 (${rep.orphans.length}, ${fmtSize(rep.orphans.reduce((a, o) => a + o.size, 0))})`,
    orphans.length ? '<table><tr><th>路径</th><th class="num">大小</th></tr>' +
      orphans.map(o => `<tr><td class="name">${esc(o.path)}</td><td class="num">${fmtSize(o.size)}</td></tr>`).join('')
      + '</table>' : '<p class="muted">（无）</p>', false));
  document.getElementById('sections').innerHTML = secs.join('');
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
