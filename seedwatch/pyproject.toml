[project]
name = "seedwatch"
version = "0.1.0"
description = "qBittorrent seed lifecycle reconciler: hardlink-based Media reference tracking, auto-tagging and ratio-gated reaping"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiohttp>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seedwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true
